[package]
name = "surrealml-core"
version = "0.1.9"
edition = "2021"
description = "The core machine learning library for SurrealML that enables SurrealDB to store and load ML models"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["dynamic"]
# below are the features for testing different engines
sklearn-tests = []
onnx-tests = []
torch-tests = []
tensorflow-tests = []
gpu = []
dynamic = ["ort/load-dynamic"]

[dependencies]
regex.workspace = true
ort = { workspace = true, features = ["cuda", "ndarray"] }
ndarray.workspace = true
once_cell.workspace = true
bytes.workspace = true
futures-util.workspace = true
futures-core.workspace = true
thiserror.workspace = true
onnx-embedding.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lib]
name = "surrealml_core"
path = "src/lib.rs"

# [build-dependencies]
# ort = { version = "1.16.2", default-features = true }